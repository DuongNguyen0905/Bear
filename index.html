  <body>
    <!-- Bộ lọc SVG dùng cho hiệu ứng "Liquid Glass" (kính lỏng): làm ảnh phía
         sau lớp kính hơi khúc xạ/lệch nhẹ như nhìn qua mặt kính không hoàn
         toàn phẳng, thay vì chỉ làm mờ (blur) đơn giản. Đặt kích thước 0x0
         (không dùng display:none — vài WebKit/WebView không áp dụng được
         filter tham chiếu tới SVG đang display:none) để không chiếm layout. -->
    <svg style="position: absolute; width: 0; height: 0; overflow: hidden;" aria-hidden="true">
      <filter id="liquid-glass-distortion" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="18" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="root"></div>
  </body>
